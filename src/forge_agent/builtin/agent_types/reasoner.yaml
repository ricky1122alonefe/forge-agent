agent_type:
  type_id: reasoner
  name: Structured Reasoner
  description: |
    Pure LLM reasoning with configurable schema profiles (sentiment, summary, extract, compare, risk).
  domain: generic
  template: prompt_agent
  params:
    - name: topic
      type: string
      required: true
      description: Subject or keyword to analyze.
    - name: schema_profile
      type: string
      required: false
      description: Output profile (analysis, sentiment, summary, extract, compare, risk).
      default: analysis
  prompt_template: |
    You are a structured analyst. Analyze the topic 「{topic}」 with profile: {schema_profile}.

    Respond with a JSON object containing:
    - verdict: one of [lean_positive, lean_neutral, lean_negative, risk]
    - confidence: a number between 0.0 and 1.0
    - risk: a number between 0.0 and 1.0
    - evidence: a list of short strings explaining your reasoning
    - recommended_action: one of [execute, watch, hold, alert]
    - metrics: an object with any relevant numeric metrics
  output_schema:
    type: object
    properties:
      verdict:
        type: string
        enum: [lean_positive, lean_neutral, lean_negative, risk]
      confidence:
        type: number
        minimum: 0
        maximum: 1
      risk:
        type: number
        minimum: 0
        maximum: 1
      evidence:
        type: array
        items:
          type: string
      recommended_action:
        type: string
        enum: [execute, watch, hold, alert]
      metrics:
        type: object
    required: [verdict, confidence, risk, evidence, recommended_action, metrics]
  output_mapping:
    verdict: verdict
    confidence: confidence
    risk: risk
    evidence: evidence
    recommended_action: recommended_action
    metrics: metrics
  mock_response: |
    {"verdict": "lean_neutral", "confidence": 0.72, "risk": 0.28,
     "evidence": ["Mock structured analysis for {topic}"],
     "recommended_action": "watch", "metrics": {}}
