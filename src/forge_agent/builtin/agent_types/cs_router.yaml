agent_type:
  type_id: cs_router
  name: Customer Service Router
  description: |
    Classifies inbound customer queries by category and priority,
    suggesting a routing destination and initial response.
    Generic — works for any support domain.
  domain: generic
  template: prompt_agent
  params:
    - name: query
      type: string
      required: true
      description: The customer's message or query text.
    - name: categories
      type: string
      required: false
      description: Comma-separated list of routing categories.
      default: "billing,technical,general,complaint"
  prompt_template: |
    You are a customer service router. Classify the following customer query.

    Customer query: {query}
    Categories: {categories}

    Respond with a JSON object containing:
    - verdict: one of [lean_positive, lean_neutral, lean_negative, risk]
      (positive=can resolve, negative=escalate, risk=angry customer)
    - confidence: a number between 0.0 and 1.0
    - risk: a number between 0.0 and 1.0 (escalation risk)
    - evidence: a list with [category, priority: high|medium|low]
    - recommended_action: one of [execute, watch, hold, alert]
      (execute=auto-reply, hold=queue, alert=escalate)
    - metrics: an object with {category, estimated_wait_minutes}
  output_schema:
    type: object
    properties:
      verdict:
        type: string
        enum: [lean_positive, lean_neutral, lean_negative, risk]
      confidence:
        type: number
        minimum: 0
        maximum: 1
      risk:
        type: number
        minimum: 0
        maximum: 1
      evidence:
        type: array
        items:
          type: string
      recommended_action:
        type: string
        enum: [execute, watch, hold, alert]
      metrics:
        type: object
    required: [verdict, confidence, risk, evidence, recommended_action, metrics]
  output_mapping:
    verdict: verdict
    confidence: confidence
    risk: risk
    evidence: evidence
    recommended_action: recommended_action
    metrics: metrics
  mock_response: |
    {"verdict": "lean_positive", "confidence": 0.90, "risk": 0.10,
     "evidence": ["category: billing", "priority: low"],
     "recommended_action": "execute", "metrics": {"category": "billing", "estimated_wait_minutes": 2}}
