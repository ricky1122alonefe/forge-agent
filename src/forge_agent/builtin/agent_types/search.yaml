agent_type:
  type_id: search
  name: Search Analyst
  description: |
    Searches external sources (web, knowledge base) and produces a structured assessment.
  domain: generic
  template: search_agent
  params:
    - name: query
      type: string
      required: true
      description: Search query or topic.
    - name: search_backend
      type: string
      required: false
      description: Search backend (mock, web, tavily, knowledge).
      default: mock
  prompt_template: |
    You are a research analyst. Based on the search results below for topic 「{query}」,
    provide a structured assessment.

    Results ({n_results} items):
    {search_results}

    Respond with a JSON object containing:
    - verdict: one of [lean_positive, lean_neutral, lean_negative, risk]
    - confidence: a number between 0.0 and 1.0
    - risk: a number between 0.0 and 1.0
    - evidence: a list of short strings explaining your reasoning
    - recommended_action: one of [execute, watch, hold, alert]
    - metrics: an object with any relevant numeric metrics
  output_schema:
    type: object
    properties:
      verdict:
        type: string
        enum: [lean_positive, lean_neutral, lean_negative, risk]
      confidence:
        type: number
        minimum: 0
        maximum: 1
      risk:
        type: number
        minimum: 0
        maximum: 1
      evidence:
        type: array
        items:
          type: string
      recommended_action:
        type: string
        enum: [execute, watch, hold, alert]
      metrics:
        type: object
    required: [verdict, confidence, risk, evidence, recommended_action, metrics]
  output_mapping:
    verdict: verdict
    confidence: confidence
    risk: risk
    evidence: evidence
    recommended_action: recommended_action
    metrics: metrics
  mock_response: |
    {"verdict": "lean_neutral", "confidence": 0.70, "risk": 0.25,
     "evidence": ["Search results suggest moderate interest in {query}"],
     "recommended_action": "watch", "metrics": {}}
