{% extends "auth_base.html" %}

{% block title %}登录 · forge-agent{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold mb-6">登录</h2>
<form method="post" action="/auth/login" class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
        <input name="username" type="text" required autocomplete="username"
               class="block w-full border border-gray-300 rounded-md p-2 text-sm">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
        <input name="password" type="password" required autocomplete="current-password"
               class="block w-full border border-gray-300 rounded-md p-2 text-sm">
    </div>
    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 text-sm font-medium">
        登录
    </button>
</form>
<p class="mt-4 text-sm text-gray-600">还没有账号？<a href="{{ register_url }}" class="text-indigo-600 hover:underline">注册</a></p>
{% endblock %}
