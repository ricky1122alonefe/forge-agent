<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forge-agent · {{ tenant_id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center space-x-3">
            <span class="text-2xl">⚡</span>
            <div>
                <h1 class="text-lg font-bold leading-tight">forge-agent</h1>
                <span class="text-xs text-gray-500">租户 {{ tenant_id }}</span>
            </div>
        </div>
    </header>
    <main class="max-w-2xl mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold">选择或创建项目</h2>
            {% if auth_enabled and auth_user %}
            <form action="/auth/logout" method="post">
                <button type="submit" class="text-sm text-gray-500 hover:text-indigo-600">退出 ({{ auth_user.username }})</button>
            </form>
            {% endif %}
        </div>

        <div class="bg-white p-6 rounded-lg shadow border border-gray-100 mb-6">
            <h3 class="font-bold text-sm text-gray-700 mb-3">已有项目</h3>
            {% if projects %}
            <ul class="divide-y divide-gray-100">
                {% for project in projects %}
                <li class="py-3 flex items-center justify-between">
                    <span class="font-medium text-sm">{{ project }}</span>
                    <a href="{{ project_link(project) }}" class="text-sm text-indigo-600 hover:underline">进入工作台 →</a>
                </li>
                {% endfor %}
            </ul>
            {% else %}
            <p class="text-sm text-gray-500">还没有项目，在下方创建一个。</p>
            {% endif %}
        </div>

        <form id="projectForm" class="bg-white p-6 rounded-lg shadow border border-gray-100 space-y-4">
            <h3 class="font-bold text-sm text-gray-700">新建项目</h3>
            <div>
                <label class="block text-sm font-medium text-gray-700">Project ID</label>
                <input name="project_id" type="text" class="mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm" required placeholder="例如 demo" pattern="[a-zA-Z0-9_.\-]+">
            </div>
            <div id="error" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded"></div>
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 text-sm font-medium">创建并进入</button>
        </form>
    </main>
    <script>
    async function apiPost(url, body) {
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
        return data;
    }
    document.getElementById('projectForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const errorBox = document.getElementById('error');
        errorBox.classList.add('hidden');
        const projectId = e.target.project_id.value.trim();
        try {
            const data = await apiPost('{{ tenant_api_prefix }}/projects', { project_id: projectId });
            window.location.href = data.url;
        } catch (err) {
            errorBox.textContent = err.message;
            errorBox.classList.remove('hidden');
        }
    });
    </script>
</body>
</html>
