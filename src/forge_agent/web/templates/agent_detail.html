{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold">编辑 Agent: {{ agent_id }}</h2>
        <a href="{{ pu('/') }}" class="text-sm text-gray-600 hover:text-indigo-600">← 返回工作台</a>
    </div>

    <form id="quickForm" class="bg-white p-6 rounded-lg shadow border border-gray-100 space-y-4 mb-6">
        <h3 class="font-bold text-sm text-gray-700">快捷编辑</h3>

        <div class="flex items-center gap-2">
            <input type="checkbox" id="mockMode" {% if agent_config.mock_mode %}checked{% endif %} class="h-4 w-4 text-indigo-600 border-gray-300 rounded">
            <label for="mockMode" class="text-sm text-gray-700">Mock 模式（演示，不花钱）</label>
        </div>
        <p class="text-xs text-amber-800 bg-amber-50 border border-amber-100 rounded px-3 py-2">开启时返回预设结果，不调用 LLM / 抓取工具。本地练习流程建议保持开启；以后需要真实分析再关闭并配置 API Key。</p>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Prompt 模板</label>
            <textarea id="prompt" rows="6" class="block w-full border border-gray-300 rounded-md p-3 text-sm focus:ring-indigo-500 focus:border-indigo-500">{{ agent_config.prompt }}</textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">工具（逗号分隔，可选）</label>
            <input id="tools" type="text" value="{{ agent_config.tools | join(', ') }}" class="block w-full border border-gray-300 rounded-md p-2 text-sm" placeholder="weibo.hot_search">
        </div>

        {% if agent_config.variables %}
        <div>
            <p class="text-xs text-gray-500">运行时需要 payload 字段：{{ agent_config.variables.values() | list | join(', ') }}</p>
        </div>
        {% endif %}

        <div id="quickError" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded"></div>
        <div id="quickSuccess" class="hidden text-sm text-green-700 bg-green-50 p-3 rounded"></div>

        <button type="submit" id="quickSaveBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 text-sm font-medium">保存快捷编辑</button>
    </form>

    <form id="editForm" class="bg-white p-6 rounded-lg shadow border border-gray-100 space-y-4">
        <h3 class="font-bold text-sm text-gray-700">高级：YAML 定义</h3>
        <div>
            <textarea name="yaml" id="yaml" rows="16" class="block w-full border border-gray-300 rounded-md p-3 font-mono text-sm focus:ring-indigo-500 focus:border-indigo-500">{{ yaml }}</textarea>
        </div>

        <div id="error" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded"></div>
        <div id="success" class="hidden text-sm text-green-700 bg-green-50 p-3 rounded"></div>

        <div class="flex items-center justify-between pt-2">
            <div class="space-x-3">
                <button type="submit" id="saveBtn" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-50 text-sm font-medium">保存 YAML</button>
            </div>
            <button type="button" onclick="deleteAgent()" class="text-sm text-red-600 hover:text-red-800">删除此 Agent</button>
        </div>
    </form>
</div>

<script>
document.getElementById('quickForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const errorBox = document.getElementById('quickError');
    const successBox = document.getElementById('quickSuccess');
    errorBox.classList.add('hidden');
    successBox.classList.add('hidden');
    const btn = document.getElementById('quickSaveBtn');
    btn.disabled = true;

    const toolsRaw = document.getElementById('tools').value.trim();
    const tools = toolsRaw ? toolsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

    try {
        await apiPut(`/agents/{{ agent_id }}/config`, {
            mock_mode: document.getElementById('mockMode').checked,
            prompt: document.getElementById('prompt').value,
            tools: tools,
        });
        successBox.textContent = '快捷编辑已保存';
        successBox.classList.remove('hidden');
        showToast('Agent 已保存', 'success');
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
    } finally {
        btn.disabled = false;
    }
});

document.getElementById('editForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const errorBox = document.getElementById('error');
    const successBox = document.getElementById('success');
    errorBox.classList.add('hidden');
    successBox.classList.add('hidden');
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;

    try {
        await apiPut(`/agents/{{ agent_id }}`, { yaml: document.getElementById('yaml').value });
        successBox.textContent = 'YAML 已保存';
        successBox.classList.remove('hidden');
        showToast('YAML 已保存', 'success');
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
    } finally {
        btn.disabled = false;
    }
});

async function deleteAgent() {
    if (!confirm('确定删除此 Agent？')) return;
    try {
        await apiDelete(`/agents/{{ agent_id }}`);
        showToast('Agent 已删除', 'success');
        setTimeout(() => window.location.href = '{{ pu('/') }}', 500);
    } catch (err) { showToast('删除失败: ' + err.message, 'error'); }
}
</script>
{% endblock %}
