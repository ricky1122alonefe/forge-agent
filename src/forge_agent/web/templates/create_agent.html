{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold">新建 Agent</h2>
        <a href="{{ pu('/') }}" class="text-sm text-gray-600 hover:text-indigo-600">← 返回工作台</a>
    </div>

    {% if agent_presets %}
    <div class="mb-6 bg-white p-4 rounded-lg shadow border border-gray-100">
        <h3 class="text-sm font-bold text-gray-700 mb-2">从预设快速创建</h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            {% for preset in agent_presets %}
            <button type="button" onclick="addPreset('{{ preset.preset_id }}')" class="text-left border border-gray-200 rounded-md p-3 hover:border-indigo-300 hover:bg-indigo-50">
                <p class="text-sm font-medium">{{ preset.name }}</p>
                <p class="text-xs text-gray-500 mt-1">{{ preset.description }}</p>
            </button>
            {% endfor %}
        </div>
    </div>
    {% endif %}

    <form id="agentForm" class="bg-white p-6 rounded-lg shadow border border-gray-100 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Agent 模板</label>
            <select name="agent_type" id="typeSelect" class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500" required>
                <option value="">请选择模板</option>
                {% for t in types %}
                <option value="{{ t.type_id }}">{{ type_labels.get(t.type_id, t.name) }}</option>
                {% endfor %}
            </select>
            <p class="mt-1 text-xs text-gray-500" id="typeDescription"></p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Agent ID</label>
            <input name="agent_id" id="agentId" type="text" class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500" required placeholder="例如 weibo_analyst" pattern="[a-zA-Z0-9_.\-]+">
            <p class="mt-1 text-xs text-gray-500">唯一标识，支持字母、数字、下划线、点、中划线</p>
        </div>

        <div id="paramsContainer" class="space-y-3"></div>

        <div id="error" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded"></div>

        <div class="flex items-center space-x-3 pt-2">
            <button type="submit" id="submitBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 text-sm font-medium">创建 Agent</button>
            <a href="{{ pu('/') }}" class="text-sm text-gray-600 hover:text-gray-800">取消</a>
        </div>
    </form>
</div>

<script>
const types = {{ types_json | safe }};
const typeSelect = document.getElementById('typeSelect');
const typeDescription = document.getElementById('typeDescription');
const paramsContainer = document.getElementById('paramsContainer');
const errorBox = document.getElementById('error');

typeSelect.addEventListener('change', function () {
    const type = types.find(t => t.type_id === this.value);
    typeDescription.textContent = type ? (type.description || '') : '';
    paramsContainer.innerHTML = '';
    if (!type || !type.params) return;

    type.params.forEach(p => {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = `
            <label class="block text-sm font-medium text-gray-700">${p.name} ${p.required ? '<span class="text-red-500">*</span>' : ''}</label>
            <p class="text-xs text-gray-500 mb-1">${p.description || ''}</p>
            <input name="params.${p.name}" type="${p.type === 'number' ? 'number' : 'text'}"
                class="block w-full border border-gray-300 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500"
                ${p.required ? 'required' : ''}
                value="${p.default || ''}">
        `;
        paramsContainer.appendChild(wrapper);
    });
});

document.getElementById('agentForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    errorBox.classList.add('hidden');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '创建中...';

    const form = e.target;
    const typeId = form.agent_type.value;
    const params = {};

    for (const input of form.querySelectorAll('#paramsContainer input')) {
        const name = input.name.replace('params.', '');
        params[name] = input.type === 'number' ? parseFloat(input.value) : input.value;
    }

    try {
        await apiPost('/agents', { agent_type: typeId, agent_id: form.agent_id.value.trim(), params });
        showToast('Agent 创建成功', 'success');
        setTimeout(() => window.location.href = '{{ pu('/') }}', 500);
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = '创建 Agent';
    }
});

async function addPreset(presetId) {
    try {
        await apiPost('/agents/from-preset', { preset_id: presetId });
        showToast('预设 Agent 已创建', 'success');
        setTimeout(() => window.location.href = '{{ pu('/') }}', 500);
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
    }
}
</script>
{% endblock %}
