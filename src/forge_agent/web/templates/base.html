<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}forge-agent{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">⚡</span>
                <h1 class="text-xl font-bold">forge-agent</h1>
                <span class="text-sm text-gray-500">{{ tenant_id }} / {{ project_id }}</span>
            </div>
            <nav class="space-x-4 text-sm">
                <a href="/" class="text-gray-600 hover:text-indigo-600">首页</a>
                <a href="/agents/new" class="text-gray-600 hover:text-indigo-600">新建 Agent</a>
                <a href="/pipelines/new" class="text-gray-600 hover:text-indigo-600">新建 Pipeline</a>
                <a href="/runs" class="text-gray-600 hover:text-indigo-600">运行历史</a>
            </nav>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
