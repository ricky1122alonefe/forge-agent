version: '3.8'

services:
  forge-agent:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - forge-data:/data
    environment:
      - FORGE_AGENT_DATA_DIR=/data
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Legacy observability dashboard for generated_agents/
  dashboard:
    build: .
    command: ["python", "-m", "forge_agent", "dashboard", "--host", "0.0.0.0", "--port", "8787"]
    ports:
      - "8788:8787"
    volumes:
      - ./generated_agents:/app/generated_agents:ro
    environment:
      - FORGE_AGENT_AUTH_ENABLED=false
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    profiles:
      - legacy-dashboard

volumes:
  forge-data:
